[package]
name = "oxithread"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.29"
env_logger = "0.11.8"
thiserror = "2.0.17"
discord-presence = "3.0.0"
uuid = { version = "1.19.0", features = ["v4"] }
rand = "0.9.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Foundation"] }
